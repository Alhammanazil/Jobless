<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/img/favicon.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/modern-normalize@2.0.0/modern-normalize.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Post a Job - Jobless</title>
  </head>
  <body>
    <nav class="nav">
      <div class="container">
        <div class="nav-brand">Jobless</div>
        <button class="hamburger" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="menu">
          <a href="index.html" class="menu-item">Home</a>
          <a href="discover.html" class="menu-item">Discover</a>
          <a href="post-job.html" class="menu-item menu-item-active"
            >Post a Job</a
          >
          <a href="contact.html" class="menu-item">Contact Us</a>
        </div>
        <div class="nav-ctas">
          <a href="" class="sign-up">Sign Up</a>
        </div>
      </div>
    </nav>
    <div class="container">
      <div class="hero animate-fade-in">
        <h1 class="hero-headline">Post a Remote Job</h1>
        <p class="hero-subheadline">
          Fill out the form below to post a new remote job opportunity.
        </p>
      </div>
      <form
        class="animate-slide-up"
        style="
          max-width: 500px;
          margin: 32px auto 0;
          display: flex;
          flex-direction: column;
          gap: 18px;
        "
      >
        <input
          type="text"
          placeholder="Job Title"
          required
          style="padding: 12px; border-radius: 6px; border: 1px solid #e3e6fa"
        />
        <input
          type="text"
          placeholder="Company Name"
          required
          style="padding: 12px; border-radius: 6px; border: 1px solid #e3e6fa"
        />
        <input
          type="text"
          placeholder="Location (Remote)"
          required
          style="padding: 12px; border-radius: 6px; border: 1px solid #e3e6fa"
        />
        <input
          type="text"
          placeholder="Salary Range"
          style="padding: 12px; border-radius: 6px; border: 1px solid #e3e6fa"
        />
        <textarea
          placeholder="Job Description"
          required
          style="
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e3e6fa;
            min-height: 100px;
          "
        ></textarea>
        <button
          type="submit"
          class="cta-primary"
          style="width: 180px; margin: 0 auto"
        >
          Post Job
        </button>
      </form>
    </div>
    <div class="menu-mobile-overlay"></div>
    <nav class="menu-mobile" tabindex="-1">
      <a href="index.html" class="menu-item">Home</a>
      <a href="discover.html" class="menu-item">Discover</a>
      <a href="post-job.html" class="menu-item menu-item-active">Post a Job</a>
      <a href="contact.html" class="menu-item">Contact Us</a>
      <a href="" class="sign-up">Sign Up</a>
    </nav>
    <script src="main.js"></script>
  </body>
</html>
