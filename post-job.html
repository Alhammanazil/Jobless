<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post a remote job — Jobless</title>
    <meta name="description" content="Post a remote job in two minutes and preview exactly how candidates will see it." />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="img/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>try{var t=JSON.parse(localStorage.getItem('jobless:theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="post">
    <main>
      <section class="hero page-hero" style="padding-bottom:28px">
        <div class="blob b1"></div><div class="blob b2"></div>
        <div class="container">
          <h1>Post a <span class="grad">remote job</span></h1>
          <p class="lead">Fill in the details and watch the preview update as you type.</p>
        </div>
      </section>

      <div class="container" id="post-wrap">
        <div class="form-layout">
          <form class="card form" id="post-form" novalidate>
            <div class="form-grid">
              <div class="group"><label for="title">Job title</label><input class="input" id="title" name="title" placeholder="e.g. Frontend Developer" autocomplete="off" /><p class="error" data-err="title"></p></div>
              <div class="group"><label for="company">Company name</label><input class="input" id="company" name="company" placeholder="e.g. Acme Inc." autocomplete="organization" /><p class="error" data-err="company"></p></div>
            </div>
            <div class="form-grid">
              <div class="group"><label for="category">Category</label><select class="select" id="category" name="category" style="width:100%"></select></div>
              <div class="group"><label for="type">Job type</label><select class="select" id="type" name="type" style="width:100%"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Freelance</option></select></div>
            </div>
            <div class="form-grid">
              <div class="group"><label for="level">Level</label><select class="select" id="level" name="level" style="width:100%"><option>Junior</option><option selected>Mid</option><option>Senior</option></select></div>
              <div class="group"><label for="tags">Skills <span style="font-weight:500;color:var(--muted)">(comma separated)</span></label><input class="input" id="tags" name="tags" placeholder="React, TypeScript" autocomplete="off" /></div>
            </div>
            <div class="form-grid">
              <div class="group"><label for="min">Salary from (USD / year)</label><input class="input" id="min" name="min" type="number" min="0" step="1000" placeholder="70000" inputmode="numeric" /></div>
              <div class="group"><label for="max">Salary to (USD / year)</label><input class="input" id="max" name="max" type="number" min="0" step="1000" placeholder="90000" inputmode="numeric" /><p class="error" data-err="max"></p></div>
            </div>
            <div class="group">
              <label for="description">Job description</label>
              <textarea class="textarea" id="description" name="description" placeholder="What will this person do, and what makes the role a good fit?"></textarea>
              <p class="hint"><span id="desc-count">0 characters</span><span>Minimum 30</span></p>
              <p class="error" data-err="description"></p>
            </div>
            <button class="btn btn-primary" type="submit" style="justify-self:start">Post Job</button>
          </form>

          <aside class="sticky" aria-label="Live preview">
            <p class="preview-label">Live preview</p>
            <div id="preview"></div>
            <p class="hint" style="margin-top:12px">Your listing is saved in this browser and shows up on Discover.</p>
          </aside>
        </div>
      </div>
    </main>
    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
