<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discover remote jobs — Jobless</title>
    <meta name="description" content="Search and filter remote jobs by category, level, type and salary. Save the ones you like and apply in a minute." />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="img/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>try{var t=JSON.parse(localStorage.getItem('jobless:theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="discover">
    <main>
      <section class="hero page-hero" style="padding-bottom:28px">
        <div class="blob b1"></div><div class="blob b2"></div>
        <div class="container">
          <h1>Discover <span class="grad">remote jobs</span></h1>
          <p class="lead">Browse every open role and find the match for your skills and interests.</p>
        </div>
      </section>

      <div class="container">
        <div class="toolbar" role="search">
          <div class="toolbar-row">
            <div class="field">
              <span class="field-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
              <label class="sr-only" for="q">Search jobs</label>
              <input class="input" id="q" type="search" placeholder="Search jobs" autocomplete="off" />
            </div>
            <label class="sr-only" for="type">Job type</label>
            <select class="select" id="type"><option value="">Any type</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Freelance</option></select>
            <label class="sr-only" for="level">Level</label>
            <select class="select" id="level"><option value="">Any level</option><option>Junior</option><option>Mid</option><option>Senior</option></select>
            <label class="sr-only" for="sort">Sort by</label>
            <select class="select" id="sort"><option value="new">Newest first</option><option value="pay">Highest pay</option></select>
          </div>
          <div class="toolbar-row">
            <div class="chips" id="chips" style="display:flex;gap:8px;flex-wrap:wrap" role="group" aria-label="Category"></div>
          </div>
          <div class="toolbar-row">
            <label class="range"><span>Min. salary</span><input id="min" type="range" min="0" max="140000" step="5000" value="0" /><b id="min-out">Any</b></label>
            <p class="hint" id="min-hint" hidden>Only jobs that list an annual salary are shown.</p>
            <label class="toggle"><input id="saved-only" type="checkbox" /> Saved only</label>
          </div>
        </div>

        <p class="source" id="source"></p>
        <div class="result-bar"><span id="count" aria-live="polite"></span><button class="link-btn" id="clear" type="button" hidden>Clear all filters</button></div>

        <div class="jobs-grid" id="grid"></div>
        <div class="empty" id="empty" hidden>
          <h3>No jobs match your filters</h3>
          <p>Try a different keyword or <button class="link-btn" id="empty-clear" type="button">clear all filters</button>.</p>
        </div>
      </div>
    </main>
    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
